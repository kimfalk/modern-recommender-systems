[project]
name = "modern-recsys"
version = "0.1.0"
description = "Code examples for AI Recommender Systems (Manning Publications)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Core
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyarrow>=14.0.0",          # parquet files (chapter 7)
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    # Deep learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Plotting
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    # Jupyter
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=7.6.0",
    # Utilities
    "tqdm>=4.62.0",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",
    "requests>=2.28.0",
    # Pipeline data models (recsys.fourstage_recsys contexts)
    "pydantic>=2.0.0",
    # Recommender models
    "implicit>=0.7.0",          # ALS retrieval
    "lightgbm>=4.0.0",          # LambdaMART (chapter 7)
    "shap>=0.44.0",             # ranker explanations (chapter 7)
    # ANN retrieval (chapter 5)
    "faiss-cpu>=1.9.0",
    # Experiment tracking
    "mlflow>=3.0.0",
    # Text embeddings
    "sentence-transformers==5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "nbstripout>=0.7.0",        # the git filter that strips notebook outputs
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recsys*"]

[tool.ruff]
indent-width = 2
line-length = 88